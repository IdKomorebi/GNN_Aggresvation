# 125 号：固定估计器 + 下游全部重算（在运行候选之前写定，避免看结果挑选）
question: 从 122 号的候选中固定论文估计器，并用它重算所有依赖估计器的下游结果
candidates:              # 全部复用 122 号的主干与评测集合（eval_masks 前 n3 行 = 规模 ≤3 全部集合，顺序与各号 sel 一致）
  E_old: uniformE         # 只预测目标 × 3 种子预测平均，两道防护（V5 论文口径；122 号复现误差 <1e-7）
  C1: reconE_cy           # 重建 × 3 种子预测平均 + 三道防护
  C2: recon+random_cy     # 重建⊕随机拼接（单主干）+ 三道防护；按"方法"评价 = 种子 0/1/2 的均值
  C3: RRE_cy              # 新：重建⊕随机拼接 × 3 种子预测平均（种子 s 的重建主干拼种子 s 的随机主干）+ 三道防护
selection_rule: |
  指标（十个目标平均）：V误差(≤3)、V误差(规模4)、M2误差、Γ2误差、M2排序 Spearman、认证前1、认证前3、背景召回前3、
  关键字段召回（扫描—认证，τ=0.5/0.7，δ=0）。
  在 C1/C2/C3 中选"不劣于其余候选的指标数最多"者（差值 <0.002 或 <0.5 个百分点视为持平）；并列时选成本低者。
  入选者必须在全部指标上不劣于 E_old，否则报告并保留 E_old。
downstream:              # 依赖估计器的全部下游（119 号不依赖估计器，不重算）
  - 117 号：决策规则（关键字段召回/精确）、扣留策略、排序（R-精确率、AP）、字段表 → outputs/d117/
  - 124 号：Γ 估计误差、背景召回、认证前 3 恢复的 Γ 比例 → outputs/d124/
  - 118 号：消融表新增行（同一指标定义）→ outputs/ablation_rows.csv
  - 计时：新估计器单集合耗时（空闲 GPU，200 个随机集合，批大小 8，与 118 号 timeE 同口径）→ outputs/time/
  - 论文：图 7（保真度）、表 5/6/9、成本段落、正文数字
split: 70/30 随机划分（无时间划分）
compute: GPU0/1/2（留一张）；CPU OMP_NUM_THREADS=1
