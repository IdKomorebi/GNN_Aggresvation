experiment:
  name: dnn100_fullscale_mk_two_datasets
  purpose: >
    在去别名后的完整字段集（PJM 41 / CAISO 41）上精确计算 M^(0..3)，检验 K 饱和、攻击器鲁棒性、
    通用模型的边际保真与 L≤M≤U 上下界、公开基底场景、效率（对最强基线），并做 CAISO 副本/备用通道对照。
theory_doc: ../paper/20260915_MK严格定义与安全语义.md   # v2
datasets:
  pjm:   {csv: ../data/Processed/pjm_rto_hourly_2025_cleaned.csv, fields_yaml: ../DNN_Aggresvation69/base.yaml, rows_train_test: [4589, 1967]}
  caiso: {csv: ../data/Processed/caiso_2025_hourly_cleaned.csv, fields_yaml: ../DNN_Aggresvation95_caiso/base.yaml, rows_train_test: [6105, 2617]}
  split: prepare_data（删常量列、删 NaN 行、shuffle seed=42、70/30）；train 内 15% 为 val（VAL_SEED=20260915）
  dealias:
    pjm:   [da_as_ss_mw_synchronized_reserve, da_as_ss_mw_thirty_minutes_reserve, da_as_as_req_mw_synchronized_reserve]
    caiso: [dam_as_requirement__mw__as_caiso__non_spinning_reserve__minimum, dam_as_clearing_price__usd_per_mw__ru__as_caiso, dam_as_clearing_price__usd_per_mw__rd__as_caiso]
  target_copies_removed: PJM 已在 69 号 drop_columns 中删除；CAISO 无 |r|>0.999 的目标副本
  near_duplicates_kept: true
sets:
  k4: 规模 1..4 全部集合 = 112,791（支持 M^(0..3)）
  k3: 规模 1..3 = 11,521（支持 M^(0..2)，攻击器族与种子噪声）
  pjm_base: 公开基底 B = {forecast_load_mw_latest_available, forecast_load_mw_day_ahead}，候选 39 字段，规模 ≤3 = 9,920
  mci: 通用模型搜索出的大背景候选（贪心至 12 + 随机排列前驱 600/字段），专用重训认证
  caiso_gameC: 14 玩家 2^14 联盟（副本/备用通道对照）
attackers:
  dnn: 98 号并行专用重训（128-128，Adam 1e-3，wd 5e-4，≤300 epoch，val 选轮次）
  tree: sklearn HistGradientBoostingRegressor（lr 0.05，≤600 轮 val 选择，31 叶，min_leaf 20，l2 1.0）
  family: 逐 (集合,目标) 在 val 上选攻击器，test 报告
monotone_closure: V̄(S) = V(argmax_{T⊆S} V_val(T))
estimators:
  L0ensx: 主口径；uniform 三种子特征 ⊕ x ⊕ x²（PJM：75 号 seed0-2；CAISO：95 号 seed0 + 本号复训 seed1/2）
  L0: uniform seed0 冻结主干 + 闭式读出
  L1x: 仅 PJM，97 号 r93 ⊕ x ⊕ x²
  direct: 共享读出头
thresholds_tau: [0.5, 0.7, 0.9]
grades: [0.05, 0.2, 0.5]
compute: GPU0/1/2（留 GPU3）；CPU 树攻击器 110 进程
