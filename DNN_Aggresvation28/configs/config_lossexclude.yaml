# DNN28 compact baseline: the DNN13 structure with optional temporal and multi-head extensions.
experiment:
  name: dnn13_compact

dataset:
  csv_path: ../data/Processed/pjm_rto_hourly_2025_cleaned.csv
  output_dir: outputs

fields:
  drop_constant_columns: true
  drop_columns:
    - datetime_beginning_utc
    - datetime_beginning_ept
    - net_sched_interchange_mw
    - prelim_load_avg_hourly
    - total_pjm_rt_load_mwh
    - wind_generation_mw
    - solar_generation_mw
    - da_as_as_mw_primary_reserve
    - da_as_as_mw_synchronized_reserve
    - da_as_as_mw_thirty_minutes_reserve
    - system_energy_price_rt
    - net_actual_interchange_mw
  confidential:
    # - net_actual_interchange_mw
    - gross_actual_interchange_mw
    - total_gen
    - metered_load_mw
    - total_losses
    - congestion_price_da
    - congestion_price_rt
    - marginal_loss_price_da
    - total_lmp_da
    - da_as_total_mw_primary_reserve
    - da_as_total_mw_synchronized_reserve
    - da_as_total_mw_thirty_minutes_reserve

correlation:
  metrics: [pearson, spearman, kendall, nmi, distance_corr]
  sample_size: 3000
  expensive_sample_size: 1200
  # Use "all" to reproduce DNN13 graph fitting; use "train" for stricter evaluation.
  fit_on: all
  reuse_cache: true

graph:
  top_k: 8
  threshold: 0.25
  symmetrize: true
  # Add target-specific minimum source counts, for example:
  # target_top_k_overrides:
  # net_actual_interchange_mw: 16
  # gross_actual_interchange_mw: 16
  # target_top_k_overrides: {}

model:
  hidden_dim: 64
  num_layers: 3
  dropout: 0.15
  attention_dropout: 0.05
  attention_dim: 64
  # DNN13 baseline is 1; increase to 4 to test the DNN27-style extension.
  attention_heads: 2
  attention_temperature: 1.0
  edge_alpha_temperature: 0.35
  alpha_init_std: 1.0
  prior_scale_init: 1.0
  gate_bias_init: -3.0
  prior_log_eps: 0.0001
  # DNN13 baseline is linear/window_size=1; temporal tests can use window_size=3 or 4.
  input_encoder: linear
  input_encoder_dropout: 0.05
  window_size: 6

training:
  epochs: 300
  batch_size: 32
  lr: 0.0005
  alpha_lr_multiplier: 12.0
  weight_decay: 0.0005
  train_ratio: 0.7
  patience: 80
  loss_fn: mse
  # This config excludes listed targets from loss and names the run "lossexclude".
  loss_exclude_confidential:
    # - net_actual_interchange_mw
    - gross_actual_interchange_mw

runtime:
  seed: 42
  # Loss-exclude runs use physical GPU 0 by default.
  device: cuda:0

evaluation:
  # Each target receives a separate DNN using only this run's General windows.
  dnn_probe:
    enabled: true
    reuse_cache: true
    hidden_dims: [128, 64]
    dropout: 0.15
    # Keep the DNN baseline stable while tuning GNN-only training parameters.
    epochs: 300
    batch_size: 32
    lr: 0.0005
    weight_decay: 0.0005
    patience: 80
