<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">联合优化：满足约束，同时减少不必要的调整</title><desc id="desc">A、B、C、D 初始等级为 2、1、1、1。假设该角色未来只能取得 2 级及以下数据，目标是 3 级；四组已核验越线组合为 AB、AC、AD、BCD。全部上调到 3 级共 7 级次，而只上调 A、D 共 3 级次，也能覆盖这四条约束。该示意用于解释联合优化，并不表示必须这样给真实数据定级。成立前提是候选级别有影响依据、等级映射有效、字段尚可调整，固定背景没有单独暴露目标。未评估组合仍需检查。</desc>
<rect width="1280" height="720" fill="#FFFFFF"/>
<defs>
<marker id="a087F79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F79"/></marker>
</defs>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#2459C4" text-anchor="start">
<tspan x="64" y="44.3">08  为什么等级需要一起考虑</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#172B3A" text-anchor="start">
<tspan x="64" y="104.75999999999999">联合优化：满足约束，同时减少不必要的调整</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#647584" text-anchor="start">
<tspan x="66" y="147.42000000000002">示意前提：候选级别已复核，且级别调整会改变该角色未来可获取的字段。</tspan>
</text>
<line x1="64" y1="676" x2="1216" y2="676" stroke="#DCE4EA" stroke-width="1"/>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#647584" text-anchor="start">
<tspan x="64" y="701.24">南网项目  /  数据分类分级研究体系</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#647584" text-anchor="end">
<tspan x="1216" y="701.28">09 / 12</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#172B3A" text-anchor="start">
<tspan x="66" y="217.52">四组已核验越线组合</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#172B3A" text-anchor="start">
<tspan x="669" y="217.52">比较满足同一组约束的方案</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#647584" text-anchor="start">
<tspan x="66" y="279.38">01</tspan>
</text>
