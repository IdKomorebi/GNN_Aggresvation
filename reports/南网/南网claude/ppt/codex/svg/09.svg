<tspan x="234.5" y="421.28000000000003">D</tspan>
</text>
<line x1="377" y1="413" x2="424" y2="413" stroke="#087F79" stroke-width="2" marker-end="url(#a087F79)"/>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#087F79" text-anchor="start">
<tspan x="438" y="419.46">目标 y</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#647584" text-anchor="start">
<tspan x="66" y="486.38">04</tspan>
</text>
