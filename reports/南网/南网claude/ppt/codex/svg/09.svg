<tspan x="153.5" y="490.28000000000003">B</tspan>
</text>
<rect x="202" y="462" width="65" height="40" rx="6" fill="#EDF3FD"/>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#2459C4" text-anchor="middle">
<tspan x="234.5" y="490.28000000000003">C</tspan>
</text>
<rect x="283" y="462" width="65" height="40" rx="6" fill="#EDF3FD"/>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#2459C4" text-anchor="middle">
<tspan x="315.5" y="490.28000000000003">D</tspan>
</text>
<line x1="377" y1="482" x2="424" y2="482" stroke="#087F79" stroke-width="2" marker-end="url(#a087F79)"/>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#087F79" text-anchor="start">
<tspan x="438" y="488.46">目标 y</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#647584" text-anchor="start">
<tspan x="67" y="579.42">选择 A 与 D，可让这四组组合各缺少成员。</tspan>
</text>
<rect x="655" y="248" width="562" height="141" rx="9" fill="#F4F7FA"/>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#647584" text-anchor="start">
<tspan x="680" y="288.46">全部上调到 3 级</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#172B3A" text-anchor="start">
<tspan x="680" y="335.42">A 2→3   B 1→3   C 1→3   D 1→3</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="51" font-weight="700" fill="#647584" text-anchor="middle">
<tspan x="1142.5" y="322.02">7</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#647584" text-anchor="middle">
<tspan x="1146.5" y="355.36">级次</tspan>
</text>
<rect x="655" y="408" width="562" height="141" rx="9" fill="#EDF7F5"/>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#087F79" text-anchor="start">
<tspan x="680" y="448.46">只上调 A、D</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#172B3A" text-anchor="start">
<tspan x="680" y="495.42">A 2→3   B 保持   C 保持   D 1→3</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="51" font-weight="700" fill="#087F79" text-anchor="middle">
<tspan x="1142.5" y="482.02">3</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#087F79" text-anchor="middle">
<tspan x="1146.5" y="515.36">级次</tspan>
</text>
<rect x="64" y="600" width="1152" height="48" rx="6" fill="#EDF3FD"/>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#2459C4" text-anchor="start">
<tspan x="82" y="630.44">关键是“哪个调整能同时满足哪些组合约束”，而不是简单上调 M 最大的字段。</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#647584" text-anchor="start">
<tspan x="66" y="663.24">示意：目标 3 级，角色最多取得 2 级字段，各级次权重相同；已知背景保留；仅讨论这四组约束。</tspan>
</text>
</svg>