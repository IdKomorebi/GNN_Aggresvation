<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">GRPO：在规则硬约束内，逐步形成等级建议</title><desc id="desc">GRPO 的重点是组内比较：从同一状态生成多条合法调整轨迹，用各轨迹回报相对组内水平的优势更新策略，并保留 KL 约束等稳定机制。状态包含当前等级、已核验风险、候选级别、剩余组合约束和调整代价；动作是合法的一级上调或申请结束。环境根据已确认的映射更新未来可得范围，历史已知 B 保留。奖励鼓励减少越线并控制调整代价，规则通过动作可行域限制，不作为可被业务收益抵消的罚项。顺序求解不自动证明强化学习必要，现有小规模实验应与整数规划及覆盖贪心比较。</desc>
<rect width="1280" height="720" fill="#FFFFFF"/>
<defs>
<marker id="a647584" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647584"/></marker>
<marker id="a2459C4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2459C4"/></marker>
</defs>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#2459C4" text-anchor="start">
<tspan x="64" y="44.3">09  联合等级决策的重点研究方法</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#172B3A" text-anchor="start">
<tspan x="64" y="104.75999999999999">GRPO：在规则硬约束内，逐步形成等级建议</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#647584" text-anchor="start">
<tspan x="66" y="147.42000000000002">同一状态采样多条调整轨迹，在组内比较收益，学习更合适的调整顺序。</tspan>
</text>
