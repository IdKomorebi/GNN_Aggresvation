<tspan x="719.0" y="504.42">调整一个字段 → 其余组合的可得性随之变化</tspan>
</text>
<rect x="64" y="542" width="720" height="66" rx="7" fill="#F4F7FA"/>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#172B3A" text-anchor="start">
<tspan x="82" y="585.52">奖励：已核验越线减少 − 调整代价</tspan>
</text>
<rect x="807" y="542" width="409" height="66" rx="7" fill="#EDF7F5"/>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#087F79" text-anchor="start">
<tspan x="826" y="573.4">通过一致性检查与补充验证</tspan>
<tspan x="826" y="600.4">才形成可提交的建议</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#647584" text-anchor="start">
<tspan x="66" y="663.24">算法保留 KL 约束等训练机制；不允许用奖励抵消规则违规。整数规划与覆盖贪心作为对照，结果见备查 A2。</tspan>
</text>
