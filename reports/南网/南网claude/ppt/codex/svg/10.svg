<rect x="1021" y="269" width="4" height="178" rx="0" fill="#2459C4"/>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#2459C4" text-anchor="start">
<tspan x="1043" y="311.5">环境反馈</tspan>
</text>
<text font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#647584" text-anchor="start">
<tspan x="1043" y="353.42">更新可得范围</tspan>
<tspan x="1043" y="383.87">重算剩余约束</tspan>
</text>
