<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">单项定级之外，还要检查组合后能揭示什么</title><desc id="desc">规则定级仍然是基础。新增分析解决的是：分别审查每个字段时不明显的信息，可能在组合后被推断出来。这里的目标必须在具体场景中仍需保护；能推断某个已经允许获取的目标，不自动构成分级问题。本页仅示意组合效应，不表示某项南网数据已经发生泄露。</desc>
