<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">基础定级：先分类，再按影响形成规则等级</title><desc id="desc">分类和分级是两件事。分类沿专业域、流程、业务对象定位到字段；分级依据要素和影响矩阵。大模型提取规则、匹配业务语义，输出可审查候选，不能替代影响判断。规则等级是后续研究的基线；如果对象已有批准等级，还需保留现行结果与变更状态。材料为所供版本，正式采用前核对生效状态。</desc>
