<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 490" role="img" aria-label="实验数据使用与评价协议" style="font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif"><title>实验数据使用与评价协议</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#147d78" stroke-width="2"/></marker></defs><rect x="45" y="70" width="235" height="105" rx="14" fill="#edf5f2" stroke="#cbdeda" stroke-width="2"/><text x="162" y="132" text-anchor="middle" font-size="30" font-weight="600" fill="#147d78">训练集</text><path d="M290,123 L350,123" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="70" width="485" height="105" rx="14" fill="white" stroke="#cbdeda" stroke-width="2"/><text x="607" y="131" text-anchor="middle" font-size="27" font-weight="500" fill="#203544">拟合专用模型</text><path d="M860,123 L917,123" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="930" y="70" width="420" height="105" rx="14" fill="#edf5f2" stroke="#cbdeda" stroke-width="2"/><text x="1140" y="131" text-anchor="middle" font-size="24" font-weight="400" fill="#607580">学习共享表示 / 求读出</text><rect x="45" y="210" width="235" height="105" rx="14" fill="#edf0f7" stroke="#cbdeda" stroke-width="2"/><text x="162" y="272" text-anchor="middle" font-size="30" font-weight="600" fill="#147d78">验证集</text><path d="M290,263 L350,263" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="210" width="485" height="105" rx="14" fill="white" stroke="#cbdeda" stroke-width="2"/><text x="607" y="271" text-anchor="middle" font-size="27" font-weight="500" fill="#203544">选模型、轮次与超参数</text><path d="M860,263 L917,263" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="930" y="210" width="420" height="105" rx="14" fill="#edf0f7" stroke="#cbdeda" stroke-width="2"/><text x="1140" y="271" text-anchor="middle" font-size="24" font-weight="400" fill="#607580">不使用测试表现作选择</text><rect x="45" y="350" width="235" height="105" rx="14" fill="#fcf0e7" stroke="#cbdeda" stroke-width="2"/><text x="162" y="412" text-anchor="middle" font-size="30" font-weight="600" fill="#147d78">测试集</text><path d="M290,403 L350,403" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="350" width="485" height="105" rx="14" fill="white" stroke="#cbdeda" stroke-width="2"/><text x="607" y="411" text-anchor="middle" font-size="27" font-weight="500" fill="#203544">报告样本外 R²</text><path d="M860,403 L917,403" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="930" y="350" width="420" height="105" rx="14" fill="#fcf0e7" stroke="#cbdeda" stroke-width="2"/><text x="1140" y="411" text-anchor="middle" font-size="24" font-weight="400" fill="#607580">汇总经验能力与风险指标</text><text x="700" y="35" text-anchor="middle" font-size="24" font-weight="600" fill="#147d78">同一拆分、同一候选集合、同一报告口径</text></svg>