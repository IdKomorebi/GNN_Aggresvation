<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 490" role="img" aria-label="发现与独立审计的配对验证" style="font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif"><title>发现与独立审计的配对验证</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#147d78" stroke-width="2"/></marker></defs><rect x="45" y="60" width="260" height="355" rx="14" fill="#edf5f2" stroke="#cbdeda" stroke-width="2"/><text x="175" y="130" text-anchor="middle" font-size="30" font-weight="600" fill="#147d78">独立划分</text><text x="175" y="194" text-anchor="middle" font-size="22" font-weight="400" fill="#607580">相同字段与目标</text><text x="175" y="240" text-anchor="middle" font-size="22" font-weight="400" fill="#607580">数据分成两部分</text><text x="175" y="286" text-anchor="middle" font-size="22" font-weight="400" fill="#607580">重复交换角色</text><path d="M315,153 L405,153" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><path d="M315,329 L405,329" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="85" width="375" height="135" rx="14" fill="#edf0f7" stroke="#d2daeb" stroke-width="2"/><text x="607" y="137" text-anchor="middle" font-size="30" font-weight="600" fill="#516d9a">发现数据</text><text x="607" y="183" text-anchor="middle" font-size="24" font-weight="400" fill="#607580">搜索并固定候选背景</text><rect x="420" y="262" width="375" height="135" rx="14" fill="#fcf0e7" stroke="#eccbb2" stroke-width="2"/><text x="607" y="311" text-anchor="middle" font-size="30" font-weight="600" fill="#d67b3f">审计数据</text><text x="607" y="357" text-anchor="middle" font-size="24" font-weight="400" fill="#607580">独立重训并评价</text><path d="M802,152 L894,152" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><path d="M802,329 L894,329" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="910" y="85" width="440" height="312" rx="14" fill="white" stroke="#cbdeda" stroke-width="2"/><text x="1130" y="139" text-anchor="middle" font-size="28" font-weight="600" fill="#147d78">比较三类结果</text><text x="1130" y="212" text-anchor="middle" font-size="26" font-weight="400" fill="#203544">风险值是否回落</text><text x="1130" y="269" text-anchor="middle" font-size="26" font-weight="400" fill="#203544">阈值跨越是否复现</text><text x="1130" y="326" text-anchor="middle" font-size="26" font-weight="400" fill="#203544">关键字段是否找回</text></svg>