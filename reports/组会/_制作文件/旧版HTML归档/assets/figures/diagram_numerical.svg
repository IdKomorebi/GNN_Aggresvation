<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 490" role="img" aria-label="数值异常的定位和修复" style="font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif"><title>数值异常的定位和修复</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#147d78" stroke-width="2"/></marker></defs><rect x="120.0" y="40" width="260" height="220" rx="14" fill="#edf5f2" stroke="#cbdeda" stroke-width="2"/><text x="146.0" y="78" text-anchor="start" font-size="18" font-weight="700" fill="#147d78">01</text><text x="250.0" y="127" text-anchor="middle" font-size="27" font-weight="600" fill="#203544">近常数特征</text><text x="250.0" y="177" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">训练标准差极小</text><path d="M387.0,150 L412.0,150" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="420.0" y="40" width="260" height="220" rx="14" fill="#edf5f2" stroke="#cbdeda" stroke-width="2"/><text x="446.0" y="78" text-anchor="start" font-size="18" font-weight="700" fill="#147d78">02</text><text x="550.0" y="127" text-anchor="middle" font-size="27" font-weight="600" fill="#203544">标准化放大</text><text x="550.0" y="177" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">测试行微小变化</text><text x="550.0" y="212" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">变成大特征值</text><path d="M687.0,150 L712.0,150" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="720.0" y="40" width="260" height="220" rx="14" fill="#edf5f2" stroke="#cbdeda" stroke-width="2"/><text x="746.0" y="78" text-anchor="start" font-size="18" font-weight="700" fill="#147d78">03</text><text x="850.0" y="127" text-anchor="middle" font-size="27" font-weight="600" fill="#203544">背景能力失真</text><text x="850.0" y="177" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">预测异常</text><text x="850.0" y="212" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">V(T) 被压到 0</text><path d="M987.0,150 L1012.0,150" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="1020.0" y="40" width="260" height="220" rx="14" fill="#e2efeb" stroke="#cbdeda" stroke-width="2"/><text x="1046.0" y="78" text-anchor="start" font-size="18" font-weight="700" fill="#147d78">04</text><text x="1150.0" y="127" text-anchor="middle" font-size="27" font-weight="600" fill="#203544">边际被放大</text><text x="1150.0" y="177" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">差分后取最大</text><text x="1150.0" y="212" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">选中异常背景</text><text x="700" y="423" text-anchor="middle" font-size="24" font-weight="500" fill="#147d78"></text><rect x="75" y="310" width="1250" height="115" rx="14" fill="#e3f1eb" stroke="#c2dacc" stroke-width="2"/><text x="700" y="354" text-anchor="middle" font-size="25" font-weight="700" fill="#147d78">本批次已实施的修复</text><text x="700" y="397" text-anchor="middle" font-size="25" font-weight="400" fill="#203544">标准差下限  +  特征范围截断  +  训练内选 λ  +  三种子预测平均</text><text x="700" y="470" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">115 号：训练数据决定防护与调参；专用重训参考值只用于评估</text></svg>