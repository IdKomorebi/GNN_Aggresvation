<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 490" role="img" aria-label="从集合评估到字段画像" style="font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif"><title>从集合评估到字段画像</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#147d78" stroke-width="2"/></marker></defs><rect x="45.0" y="120" width="230.0" height="220" rx="14" fill="#edf5f2" stroke="#cbdeda" stroke-width="2"/><text x="71.0" y="158" text-anchor="start" font-size="18" font-weight="700" fill="#147d78">01</text><text x="160.0" y="207" text-anchor="middle" font-size="27" font-weight="600" fill="#203544">任意字段集合</text><text x="160.0" y="257" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">输入可见字段 S</text><path d="M282.0,230 L307.0,230" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="315.0" y="120" width="230.0" height="220" rx="14" fill="#edf5f2" stroke="#cbdeda" stroke-width="2"/><text x="341.0" y="158" text-anchor="start" font-size="18" font-weight="700" fill="#147d78">02</text><text x="430.0" y="207" text-anchor="middle" font-size="27" font-weight="600" fill="#203544">通用估计器</text><text x="430.0" y="257" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">快速得到 V̂(S)</text><path d="M552.0,230 L577.0,230" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="585.0" y="120" width="230.0" height="220" rx="14" fill="#edf5f2" stroke="#cbdeda" stroke-width="2"/><text x="611.0" y="158" text-anchor="start" font-size="18" font-weight="700" fill="#147d78">03</text><text x="700.0" y="207" text-anchor="middle" font-size="27" font-weight="600" fill="#203544">边际风险计算</text><text x="700.0" y="257" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">M̂、Γ̂、背景排序</text><path d="M822.0,230 L847.0,230" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="855.0" y="120" width="230.0" height="220" rx="14" fill="#edf5f2" stroke="#cbdeda" stroke-width="2"/><text x="881.0" y="158" text-anchor="start" font-size="18" font-weight="700" fill="#147d78">04</text><text x="970.0" y="207" text-anchor="middle" font-size="27" font-weight="600" fill="#203544">少量专用验证</text><text x="970.0" y="257" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">固定候选后确认</text><path d="M1092.0,230 L1117.0,230" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="1125.0" y="120" width="230.0" height="220" rx="14" fill="#e2efeb" stroke="#cbdeda" stroke-width="2"/><text x="1151.0" y="158" text-anchor="start" font-size="18" font-weight="700" fill="#147d78">05</text><text x="1240.0" y="207" text-anchor="middle" font-size="27" font-weight="600" fill="#203544">字段风险画像</text><text x="1240.0" y="257" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">风险量＋支撑背景</text><text x="700" y="423" text-anchor="middle" font-size="24" font-weight="500" fill="#147d78">本轮增加了字段级产物，并把估计与验证接在同一流程中</text></svg>