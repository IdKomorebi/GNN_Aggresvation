<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 490" role="img" aria-label="受控报价加成算例的机制示意" style="font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif"><title>受控报价加成算例的机制示意</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#147d78" stroke-width="2"/></marker></defs><text x="250" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#147d78">已知机制的受控验证</text><rect x="55" y="92" width="320" height="280" rx="14" fill="#edf5f2" stroke="#cbdeda" stroke-width="2"/><text x="215" y="138" text-anchor="middle" font-size="29" font-weight="600" fill="#147d78">机组 313_CC_1</text><circle cx="215" cy="210" r="44" fill="white" stroke="#147d78" stroke-width="3"/><text x="215" y="222" text-anchor="middle" font-size="34" font-weight="600" fill="#147d78">G</text><text x="215" y="298" text-anchor="middle" font-size="24" font-weight="400" fill="#203544">出力 Pɡ 定位报价段</text><text x="215" y="341" text-anchor="middle" font-size="22" font-weight="600" fill="#d67b3f">私有报价加成 κ</text><path d="M375,212 L465,212" fill="none" stroke="#147d78" stroke-width="3"/><circle cx="485" cy="212" r="11" fill="#147d78"/><text x="485" y="173" text-anchor="middle" font-size="24" font-weight="400" fill="#203544">本节点</text><path d="M497,212 L865,212" fill="none" stroke="#147d78" stroke-width="3"/><rect x="655" y="190" width="60" height="44" rx="4" fill="#fcf0e7" stroke="#d67b3f" stroke-width="2"/><text x="685" y="175" text-anchor="middle" font-size="23" font-weight="600" fill="#d67b3f">C6</text><circle cx="885" cy="212" r="11" fill="#516d9a"/><text x="885" y="173" text-anchor="middle" font-size="24" font-weight="400" fill="#203544">远端节点</text><text x="590" y="268" text-anchor="middle" font-size="27" font-weight="600" fill="#147d78">电价 λɡ</text><text x="920" y="268" text-anchor="middle" font-size="25" font-weight="600" fill="#516d9a">远端电价</text><rect x="1000" y="85" width="335" height="295" rx="14" fill="white" stroke="#cbdeda" stroke-width="2"/><text x="1167" y="137" text-anchor="middle" font-size="26" font-weight="600" fill="#147d78">预先写下的预期</text><text x="1167" y="201" text-anchor="middle" font-size="22" font-weight="400" fill="#203544">出力＋本节点电价有增益</text><text x="1167" y="259" text-anchor="middle" font-size="22" font-weight="400" fill="#203544">邻近电价可能替代</text><text x="1167" y="317" text-anchor="middle" font-size="22" font-weight="400" fill="#203544">阻塞后远端价格失效</text><rect x="65" y="400" width="1270" height="65" rx="14" fill="#edf5f2" stroke="#cbdeda" stroke-width="2"/><text x="700" y="442" text-anchor="middle" font-size="25" font-weight="400" fill="#203544">边际机组条件下：λɡ = (1 + κ) · c段(Pɡ)　｜　机制预期在实验前登记</text></svg>