<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 490" role="img" aria-label="125 号最终估计器的训练与查询结构" style="font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif"><title>125 号最终估计器的训练与查询结构</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#147d78" stroke-width="2"/></marker></defs><text x="250" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#147d78">一次预学习</text><text x="900" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#147d78">每个查询子集 S</text><rect x="45" y="85" width="375" height="140" rx="14" fill="#edf5f2" stroke="#cbdeda" stroke-width="2"/><text x="232" y="130" text-anchor="middle" font-size="29" font-weight="700" fill="#147d78">重建主干 φ</text><text x="232" y="173" text-anchor="middle" font-size="22" font-weight="400" fill="#607580">预测目标＋重建被遮候选列</text><text x="232" y="207" text-anchor="middle" font-size="18" font-weight="400" fill="#607580">仅在训练数据上优化</text><rect x="45" y="275" width="375" height="120" rx="14" fill="#edf0f7" stroke="#ced9e9" stroke-width="2"/><text x="232" y="323" text-anchor="middle" font-size="29" font-weight="700" fill="#516d9a">随机主干 φ̃</text><text x="232" y="365" text-anchor="middle" font-size="22" font-weight="400" fill="#607580">固定随机初始化，不训练</text><path d="M425,150 L520,230" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><path d="M425,335 L520,260" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="540" y="115" width="350" height="235" rx="14" fill="white" stroke="#cbdeda" stroke-width="2"/><text x="715" y="165" text-anchor="middle" font-size="27" font-weight="600" fill="#203544">按可见集合提取特征</text><text x="715" y="218" text-anchor="middle" font-size="32" font-weight="600" fill="#147d78">[xₛ, xₛ², φ, φ̃]</text><text x="715" y="267" text-anchor="middle" font-size="23" font-weight="400" fill="#607580">每个种子单独求解读出</text><text x="715" y="310" text-anchor="middle" font-size="22" font-weight="400" fill="#607580">训练内交叉验证选 λ</text><path d="M895,235 L956,235" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="975" y="115" width="365" height="235" rx="14" fill="#edf5f2" stroke="#cbdeda" stroke-width="2"/><text x="1157" y="163" text-anchor="middle" font-size="27" font-weight="600" fill="#147d78">三个种子预测取平均</text><text x="1157" y="218" text-anchor="middle" font-size="23" font-weight="400" fill="#607580">数值保护与范围截断</text><text x="1157" y="270" text-anchor="middle" font-size="31" font-weight="600" fill="#203544">得到 V̂(S)</text><text x="1157" y="312" text-anchor="middle" font-size="21" font-weight="400" fill="#607580">再计算 M̂、Γ̂ 与候选背景</text><text x="700" y="450" text-anchor="middle" font-size="24" font-weight="600" fill="#147d78">C3 = 重建与随机特征在种子内拼接；种子之间平均预测，共三次读出</text></svg>