<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 490" role="img" aria-label="字段风险的评价对象" style="font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif"><title>字段风险的评价对象</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#147d78" stroke-width="2"/></marker></defs><rect x="50" y="70" width="400" height="320" rx="14" fill="#f0f4f7" stroke="#d4dfe8" stroke-width="2"/><text x="250" y="115" text-anchor="middle" font-size="27" font-weight="600" fill="#516d9a">接收者已有信息</text><rect x="80" y="145" width="150" height="175" rx="14" fill="white" stroke="#ccdce2" stroke-width="2"/><text x="155" y="185" text-anchor="middle" font-size="21" font-weight="400" fill="#516d9a">已公开基底 B</text><rect x="102" y="208" width="106" height="16" rx="3" fill="#dbe8ed" stroke="#dbe8ed" stroke-width="2"/><rect x="102" y="236" width="106" height="16" rx="3" fill="#dbe8ed" stroke="#dbe8ed" stroke-width="2"/><rect x="102" y="264" width="106" height="16" rx="3" fill="#dbe8ed" stroke="#dbe8ed" stroke-width="2"/><rect x="270" y="145" width="150" height="175" rx="14" fill="white" stroke="#ccdce2" stroke-width="2"/><text x="345" y="185" text-anchor="middle" font-size="21" font-weight="400" fill="#516d9a">额外背景 T</text><rect x="292" y="208" width="106" height="16" rx="3" fill="#dbe8ed" stroke="#dbe8ed" stroke-width="2"/><rect x="292" y="236" width="106" height="16" rx="3" fill="#dbe8ed" stroke="#dbe8ed" stroke-width="2"/><rect x="292" y="264" width="106" height="16" rx="3" fill="#dbe8ed" stroke="#dbe8ed" stroke-width="2"/><text x="250" y="367" text-anchor="middle" font-size="23" font-weight="400" fill="#607580">仅限制额外背景：|T| ≤ K</text><rect x="515" y="145" width="230" height="175" rx="14" fill="#fbefe5" stroke="#eccbb2" stroke-width="2"/><text x="630" y="195" text-anchor="middle" font-size="28" font-weight="600" fill="#d67b3f">拟评估字段 i</text><text x="630" y="245" text-anchor="middle" font-size="22" font-weight="400" fill="#607580">单独看 / 加入背景</text><text x="630" y="280" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">同一字段，两种条件</text><path d="M457,235 L505,235" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><path d="M755,235 L837,235" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="852" y="70" width="495" height="320" rx="14" fill="white" stroke="#d5e4de" stroke-width="2"/><text x="1100" y="117" text-anchor="middle" font-size="26" font-weight="600" fill="#147d78">对受保护目标 Y 的新增推断能力</text><text x="880" y="182" text-anchor="start" font-size="22" font-weight="400" fill="#607580">已有信息</text><rect x="1015" y="160" width="180" height="32" rx="4" fill="#a7c8c1" stroke="#a7c8c1" stroke-width="2"/><text x="880" y="243" text-anchor="start" font-size="22" font-weight="400" fill="#607580">再加字段 i</text><rect x="1015" y="220" width="180" height="32" rx="4" fill="#a7c8c1" stroke="#a7c8c1" stroke-width="2"/><rect x="1198" y="220" width="92" height="32" rx="4" fill="#d67b3f" stroke="#d67b3f" stroke-width="2"/><text x="1243" y="289" text-anchor="middle" font-size="21" font-weight="600" fill="#d67b3f">边际增量 Δ</text><text x="1100" y="351" text-anchor="middle" font-size="23" font-weight="400" fill="#147d78">遍历预算内背景，取最大增量 M</text><text x="700" y="449" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">示意：比较“加入字段前后”的能力变化；条形长度不代表实验数值</text></svg>