<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 490" role="img" aria-label="统一性能测量" style="font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif"><title>统一性能测量</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#147d78" stroke-width="2"/></marker></defs><rect x="120.0" y="120" width="260" height="220" rx="14" fill="#edf5f2" stroke="#cbdeda" stroke-width="2"/><text x="146.0" y="158" text-anchor="start" font-size="18" font-weight="700" fill="#147d78">01</text><text x="250.0" y="207" text-anchor="middle" font-size="27" font-weight="600" fill="#203544">固定数据与设备</text><text x="250.0" y="257" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">同一空闲 GPU</text><text x="250.0" y="292" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">每组 200 集合</text><path d="M387.0,230 L412.0,230" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="420.0" y="120" width="260" height="220" rx="14" fill="#edf5f2" stroke="#cbdeda" stroke-width="2"/><text x="446.0" y="158" text-anchor="start" font-size="18" font-weight="700" fill="#147d78">02</text><text x="550.0" y="207" text-anchor="middle" font-size="27" font-weight="600" fill="#203544">统一查询设置</text><text x="550.0" y="257" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">批大小 8</text><text x="550.0" y="292" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">预热后计时</text><path d="M687.0,230 L712.0,230" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="720.0" y="120" width="260" height="220" rx="14" fill="#edf5f2" stroke="#cbdeda" stroke-width="2"/><text x="746.0" y="158" text-anchor="start" font-size="18" font-weight="700" fill="#147d78">03</text><text x="850.0" y="207" text-anchor="middle" font-size="27" font-weight="600" fill="#203544">等价实现加速</text><text x="850.0" y="257" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">复用 Gram 计算</text><text x="850.0" y="292" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">批量求解 λ</text><path d="M987.0,230 L1012.0,230" fill="none" stroke="#147d78" stroke-width="3" marker-end="url(#arrow)"/><rect x="1020.0" y="120" width="260" height="220" rx="14" fill="#e2efeb" stroke="#cbdeda" stroke-width="2"/><text x="1046.0" y="158" text-anchor="start" font-size="18" font-weight="700" fill="#147d78">04</text><text x="1150.0" y="207" text-anchor="middle" font-size="27" font-weight="600" fill="#203544">核对数值一致</text><text x="1150.0" y="257" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">RTS、CAISO 抽查</text><text x="1150.0" y="292" text-anchor="middle" font-size="20" font-weight="400" fill="#607580">最大差为 0</text><text x="700" y="423" text-anchor="middle" font-size="24" font-weight="500" fill="#147d78">一次性预训练与每集合查询分别计时；本页不包含新训练实验</text></svg>