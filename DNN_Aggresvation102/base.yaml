experiment:
  name: dnn102_single_vs_multi_target
  purpose: P0-2（paper/20260918 计划 §13、§20）：single-target vs multi-target backbone；并诊断真值攻击器族是否需要加入单目标 DNN。
protocol: ../paper/FINAL_PROTOCOL.md（冻结版，2026-09-18）
datasets: [pjm, caiso]   # 各 41 候选字段 / 12 敏感目标
sets: k3（规模 1..3 全部 11,521 个集合，来自 100 号 outputs/sets）
backbones:
  single_target: 每个目标一个（输出维度 1），协议同 FINAL_PROTOCOL §8，seed 0，共 24 个
  multi_target: 沿用 75 号(PJM) / 95 号(CAISO) uniform seed0（12 输出）
estimators:
  - single-target φ+x,x²（本号）
  - 无 φ：x,x² ridge（本号，--nophi）
  - multi-target φ+x,x²（本号 run_est_multi.py，单种子，与 single 公平对照）
  - multi-target 三种子集成+x,x²（100 号 L0ensx，k4 中取 k3 子集）
truth:
  main: 100 号 k4 真值（多目标 DNN，val 选轮次）∪ 100 号树模型 k3 → 攻击器族取 max（val 选择）→ 单调闭包
  diagnosis: 本号单目标 DNN 专用重训，每数据集每目标抽样 1,500 个集合（--limit 500 × 3 分片）
metrics: [V-MAE, 边际MAE, M-MAE(K=1,2), Kendall(M), 档位一致, 见证召回, τ=0.7 critical recall/precision/false-safe, 查询时延, 预学习成本]
gpu: 0/1/2（留 GPU3）
