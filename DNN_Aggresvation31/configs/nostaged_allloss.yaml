# DNN31 nostaged allloss：无 staged training + 全 12 target
experiment:
  name: nostaged_allloss

dataset:
  csv_path: ../data/Processed/pjm_rto_hourly_2025_cleaned.csv
  output_dir: outputs
  split_mode: shuffle

fields:
  drop_constant_columns: true
  drop_columns:
    - datetime_beginning_utc
    - datetime_beginning_ept
    - net_sched_interchange_mw
    - prelim_load_avg_hourly
    - total_pjm_rt_load_mwh
    - wind_generation_mw
    - solar_generation_mw
    - da_as_as_mw_primary_reserve
    - da_as_as_mw_synchronized_reserve
    - da_as_as_mw_thirty_minutes_reserve
    - system_energy_price_rt
  confidential:
    - net_actual_interchange_mw
    - gross_actual_interchange_mw
    - total_gen
    - metered_load_mw
    - total_losses
    - congestion_price_da
    - congestion_price_rt
    - marginal_loss_price_da
    - total_lmp_da
    - da_as_total_mw_primary_reserve
    - da_as_total_mw_synchronized_reserve
    - da_as_total_mw_thirty_minutes_reserve

correlation:
  metrics: [pearson, spearman, kendall, nmi, distance_corr]
  sample_size: 3000
  expensive_sample_size: 1200
  cache_dir: outputs/relationship_cache

graph:
  top_k: 8
  threshold: 0.25
  symmetrize: true

model:
  architecture: hybrid_bilinear_gated
  hidden_dim: 64
  num_layers: 3
  dropout: 0.15
  attention_dropout: 0.05
  attention_dim: 64
  attention_temperature: 0.8
  edge_alpha_temperature: 0.35
  alpha_init_std: 1.0
  prior_scale_init: 1.0
  gate_bias_init: -3.0
  prior_log_eps: 0.0001
  target_specific_heads: true
  window_size: 4
  input_encoder: linear
  input_encoder_dropout: 0.0
  bipartite: true

training:
  epochs: 300
  batch_size: 128
  lr: 0.0005
  alpha_lr_multiplier: 12.0
  weight_decay: 0.0005
  train_ratio: 0.7
  patience: 80
  loss_fn: mse
  loss_exclude_confidential: []
  staged_training:
    enabled: false

runtime:
  seed: 42
  device: cuda:3

evaluation:
  probe_results_csv: ../DNN_Aggresvation4/outputs/target_probe_20260521_113054/target_probe_results.csv
