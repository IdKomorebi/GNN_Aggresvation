experiment:
  name: dnn115_estimator_marginal_fidelity
  purpose: 隔离实验——通用推断模型对"字段风险 M"的保真度：诊断真实数据上的高估来源，并比较不用真值的改进方案
datasets: [111 RTS-GMLC, 112 NEM, 114 pjm_load, 114 pjm_gen_ic, 114 caiso_load]（共 11 个目标，均有三攻击器精确真值）
backbones: 复用各号已训练的 3 种子主干，不重训；变体 G 复用 75/95/100 号的全字段全目标主干
variants:
  A: 原口径·三种子特征拼接（91 号 featridge，holdout 选 λ，特征标准差下限 1e-8）——取各号 est.npz
  B: 原口径·单种子
  C: 三种子拼接 + 数值修正（标准差下限 1e-3、测试特征截断到训练集范围）
  D: 单种子 + 数值修正 + 5 折选 λ
  E: 三个单种子读出（D 的设置）取预测平均
  F: E + 交叉拟合（训练集分两半各拟读出，一半挑背景、另一半评估）
  G: E 的设置，但主干换成全字段、全目标预训练的主干（仅 114 号三组）
metrics: [V 误差, M^(2) 偏差/误差/排序 Spearman, 认证前 1/3/10 个背景的下界比, τ=0.5 关键字段召回/精确]
data_boundary: 所有修正只用训练集信息；测试集只用于计算 R²；真值只用于评估，不进入任何估计环节
compute: GPU1、GPU2（GPU0 用于 114 号，GPU3 留空）
